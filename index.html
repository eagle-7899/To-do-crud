<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Todo List</title>
    <!-- Agar bootstrap faylingiz bo'lmasa, pastdagi linkni CDN qilib ishlatsangiz ham bo'ladi -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head> 
  <body>
    <header class="container my-5 text-center">
      <h1 class="display-4">Todo List</h1>
      <small>by <a href="https://www.github.com/akhrorSoliev">Akhror Soliev</a></small>
      
      <!-- VIDEODAGI VAQT QISMI QO'SHILDI -->
      <div id="time" class="mt-3 fs-5 fw-bold text-secondary">
        <span id="full-day"></span> 
        <span id="hour"></span>:<span id="minute"></span>:<span id="second"></span>:<span id="milisecond"></span>
      </div>
    </header>

    <main class="container">
      <!-- ID o'zgartirildi: form-create[cite: 2] -->
      <form id="form-create" class="mb-3">
        <div class="mb-3">
          <label for="input-create" class="form-label">Enter Todo Text</label>
          <input
            id="input-create"
            type="text"
            class="form-control"
            placeholder="Text..."
            autocomplete="off"
          />
          <!-- ID o'zgartirildi: message-create[cite: 2] -->
          <span id="message-create" class="text-danger"></span>
        </div>
        <button type="submit" class="btn btn-primary ms-auto d-block">Add</button>
      </form>

      <div class="todos-div">
        <!-- ID o'zgartirildi: list-group-todo[cite: 2] -->
        <ul id="list-group-todo" class="list-todos list-group"></ul>
      </div>
    </main>

    <div id="modal" class="todo-modal hidden">
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h4>Change This Todo</h4>
          <img onclick="closeTodos()" id="close-modal" src="img/close.svg" width="20" height="20" alt="Yopish" />
        </div>
        <div class="card-body">
          <!-- ID o'zgartirildi: form-edit[cite: 2] -->
          <form id="form-edit">
            <div class="mb-3">
              <input
                type="text"
                id="change-input"
                class="form-control"
                autocomplete="off"
                placeholder="text for change"
              />
              <span id="change-error" class="text-danger"></span>
            </div>
            <span class="d-flex">
              <button type="submit" class="btn btn-primary d-block ms-auto">
                Save Changes
              </button>
            </span>
          </form>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden"></div>

    <!-- script -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
